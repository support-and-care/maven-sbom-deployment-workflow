name: Deploy SBOMs to DependencyTrack

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at 00:00 UTC

jobs:
  read-repos:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Read Maven projects from repos.json and convert to matrix
        id: set-matrix
        run: |
          # Only Maven projects can be built here; other ecosystems (e.g. pypi)
          # are handled by fetch-upload-sboms.yml
          JSON=$(jq -c '[.[] | select(.ecosystem == "maven")]' repos.json)
          echo "matrix=$JSON" >> $GITHUB_OUTPUT

  build-and-upload-sboms:
    needs: read-repos
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.read-repos.outputs.matrix) }}
      fail-fast: false
      max-parallel: 10

    steps:
      - name: Clone repo ${{ matrix.name }}
        run: git clone ${{ matrix.url }} ${{ matrix.name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Generate SBOM using CycloneDX
        working-directory: ./${{ matrix.name }}
        run: |
          # Retry to survive transient Maven Central errors such as 429 Too Many Requests
          for attempt in 1 2 3; do
            mvn -B org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in $((attempt * 30))s..."
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Upload SBOM to DependencyTrack
        uses: DependencyTrack/gh-upload-sbom@v4
        with:
          serverHostname: 'apiserver-mglnxlm8fsyhwlp7xgwjqa56.production.open-elements.cloud'
          apiKey: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
          projectName: ${{ matrix.name }}
          projectVersion: 'SNAPSHOT'
          bomFilename: "${{ matrix.name }}/target/bom.xml"
          autoCreate: true
